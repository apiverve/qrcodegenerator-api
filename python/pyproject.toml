[project]
name = "apiverve-qrcodegenerator"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "QR Code Generator creates customizable QR codes with support for colors, gradients, logos, and various styling options. Generate professional QR codes for marketing, packaging, and digital experiences."
keywords = ["qr code generator api", "qr code api", "qr generator api", "bulk qr code generator", "qr code generator"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/qrcodegenerator?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/qrcodegenerator?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/qrcodegenerator-api"
Twitter = "https://twitter.com/apivervehq"
